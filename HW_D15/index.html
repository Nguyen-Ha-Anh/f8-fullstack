<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <script>
        const colors = Array.from({ length: 20000 }, (_, i) => ({
            id: i + 1,
            name: `color ${i + 1}`
        }));
        const flowers = Array.from({ length: 400000 }, (_, i) => ({
            id: i + 1,
            name: `flower ${i + 1}`,
            colorId: Math.floor(Math.random() * 20000) + 1
        }));

        flowers.sort((a, b) => a.colorId - b.colorId);
        colors.sort((a, b) => a.id - b.id);

        let i = 0;
        let z = 0;
        const mergeResult = [];

        while (i < colors.length && z < flowers.length) {
            const flower = flowers[z];
            const color = colors[i];

            if (flower.colorId === color.id) {
                mergeResult.push({ ...flower, colorName: color.name });
                z++;
            } else if (flower.colorId < color.id) {
                z++;
            } else {
                i++;
            }
        }

        const binarySearch = (colors, targetId) => {
        let start = 0;
        let end = colors.length - 1;

        while (start <= end) {
            const middle = Math.floor((start + end) / 2);
            if (colors[middle].id === targetId) return colors[middle];
            if (colors[middle].id < targetId) start = middle + 1;
            else end = middle - 1;
        }

        return null;
    };


        const binaryJoin = (flowers, colors) => {
            const sortedColors = [...colors].sort((a, b) => a.id - b.id);
            const result = flowers.map(flower => {
                const matchedColor = binarySearch(sortedColors, flower.colorId);
                return {
                    ...flower,
                    colorName: matchedColor ? matchedColor.name : "Unknown"
                };
            });
            return result;
        };

    </script>
</body>
</html>
