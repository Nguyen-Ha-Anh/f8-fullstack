<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="
    https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css
    " rel="stylesheet">
</head>
<style>

    .container {
        width: 600px;
        margin: auto;
    }
    
    table {
        width: 100%;
        margin-top: 20px;
    }
    
    td, th {
        padding: 8px;
        border-bottom: 1px solid #ccc;
    }

    td:first-child, td:last-child{
        text-align: right;
    }

    .editBtn {
        color: green;
    }

    .delBtn {
        color: red;
    }

    .container input {
        width: 100%;
        padding: 12px;
        font-size: 24px;
    }

</style>
<body>
    <div class="container">
        <input type="text" placeholder="search employees">
        <table cellspacing="0">
            <thead>
                <tr>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </div>

    <script>

        const headers = [
            'id','name', 'address', 'age', 'action'
        ]

        const employees = [
            {id: 1, name: 'Pham Cong Tin', address: 'Hoai Duc - Ha Noi', age: 27},
            {id: 2, name: 'Nguyen Nam Tao', address: 'Co Nhue - Ha Noi', age: 17},
            {id: 3, name: 'Pham Xuan Bac', address: 'Soc Son - Ha Noi', age: 27}
        ]

        const renderTable = (employees) => {
            const tableHeaderE = document.querySelector('table thead tr')
            headers.forEach(header => {
                const cell = document.createElement('th')
                cell.innerText = header
                tableHeaderE.append(cell)
            })

            const tableBodyE = document.querySelector('table tbody')
            employees.forEach(employee => {
                const row = document.createElement('tr')
                headers.forEach(header => {
                    const cell = document.createElement('td')
                    if (header === 'action'){
                        const editBtn = document.createElement('span')
                        const delBtn = document.createElement('span')

                        editBtn.setAttribute('class', 'mdi mdi-pencil-outline editBtn')
                        delBtn.setAttribute('class', 'mdi mdi-trash-can-outline delBtn')

                        cell.append(editBtn)
                        cell.append(delBtn)
                    }
                    else {
                        cell.innerText = employee[header]
                    }
                    row.append(cell)
                })
                tableBodyE.append(row)
            })

        }
        
        const inputE = document.querySelector('.container input[name="search"]')
        inputE.addEventListener('input', (e) => {
            console.log(e.target.value)
        })
        // tableBodyE.innerHTML = rowsHtml
        renderTable(employees)
    </script>
</body>
</html>
