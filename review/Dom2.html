<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input, button {
        font-size: 24px;
        padding: 12px;
    }
</style>
<body>
    <input type="text" placeholder="name" name="name">
    <button>Get Value</button>

    <span></span>

    <script>
        const inputE = document.querySelector('input[name="name"]')
        const buttonE = document.querySelector('button')
        const spanE = document.querySelector('span')

        buttonE.addEventListener('click', () =>{
            spanE.innerHTML = inputE.value
        })

        // inputE.addEventListener('input', (e) => {
        //     console.log('inputing', e.target.value)
        // })
    </script>
</body>
</html>
