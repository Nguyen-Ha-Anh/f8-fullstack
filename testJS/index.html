<!DOCTYPE html>

<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      padding: 20px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: space-between;
    }

    input {
        padding: 10px;
    }

    th {
        font-weight: 400;
    }


  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="searchInput" placeholder="Search employees" />
    
    <select id="team">
      <option value="">Teams</option>
      <option value="Design">Reacjs</option>
      <option value="Development">Expressjs</option>
      <option value="HR">Nestjs</option>
    </select>

    <button id="createBtn">Create Schedule</button>
  </div>

  <table cellpadding="8" id="empTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Team</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>

    <script src="./main.js"></script>
</body>
</html>
