<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="changeTextBtn">Đổi nội dung tất cả P</button>
    <p>Đoạn 1</p>
    <p>Đoạn 2</p>
    <p>Đoạn 3</p>

    <script>
//Bai 3
const button = document.querySelector('#changeTextBtn')

button.addEventListener('click', function() {
    const allP = document.querySelectorAll('p')
    allP.forEach((p,index) => {
        p.innerText = `Da doi noi dung ${index + 1}`
    })
})
    </script>
</body>
</html>
