services:
  db:
    image: postgres:17
    container_name: postgres_f88
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - "5001:5432"
    volumes:
      - ./db:/var/lib/postgresql/data

  api:
    image: node:24-alpine3.21
    command: 
      - npx
      - json-server
      - db.json

