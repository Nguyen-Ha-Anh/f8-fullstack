    <script>
const orders = [
   { id: 1, employeeId: 1, productId: 4, quantity: 1 },
   { id: 2, employeeId: 2, productId: 2, quantity: 4 },
   { id: 3, employeeId: 1, productId: 5, quantity: 1 },
   { id: 4, employeeId: 3, productId: 1, quantity: 2 },
   { id: 5, employeeId: 2, productId: 5, quantity: 3 },
   { id: 6, employeeId: 4, productId: 1, quantity: 1 },
   { id: 7, employeeId: 5, productId: 3, quantity: 2 },
];

const products = [
   { id: 1, name: "Phone", price: 1200 },
   { id: 2, name: "Laptop", price: 3000  },
   { id: 3, name: "Tab", price: 2000  },
   { id: 4, name: "PC", price: 800  },
   { id: 5, name: "Monitor", price: 1500  },
];

const quantityProducts = orders.filter(order => order.quantity >= 3);
console.log(quantityProducts)



/** Lấy ra danh sách các đơn hàng có tổng tiền lớn hơn hoặc bằng 3000.

👉 Gợi ý:
Tổng tiền của mỗi đơn hàng = product.price * quantity.

Bạn cần nối dữ liệu từ orders và products để tính tổng tiền cho từng đơn hàng.

Sau đó dùng .filter(...) để giữ lại các đơn hàng có tổng tiền ≥ 3000. */

const expensiveOrders = orders.filter(order => {
  const product = products.find(p => p.id === order.productId);
  const total = product.price * order.quantity;
  return total >= 3000;
});

console.log(expensiveOrders);
