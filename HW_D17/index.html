<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
const customers = [
    { id: 1, name: "John Doe" },
    { id: 2, name: "Jane Smith" },
    { id: 3, name: "Alice Johnson" },
    { id: 4, name: "Bob Brown" },
    { id: 5, name: "Charlie Green" },
];

const products = [
    { id: 101, name: "Laptop", price: 1200 },
    { id: 102, name: "Phone", price: 800 },
    { id: 103, name: "Tablet", price: 500 },
    { id: 104, name: "Smartwatch", price: 300 },
    { id: 105, name: "Headphones", price: 150 },
];

const orders = [
    { id: 1001, customerId: 1, items: [{ productId: 101, quantity: 2 }, { productId: 102, quantity: 1 }] },
    { id: 1002, customerId: 2, items: [{ productId: 102, quantity: 1 }, { productId: 103, quantity: 3 }] },
    { id: 1003, customerId: 3, items: [{ productId: 104, quantity: 5 }, { productId: 105, quantity: 2 }] },
    { id: 1004, customerId: 4, items: [{ productId: 101, quantity: 1 }, { productId: 103, quantity: 2 }] },
    { id: 1005, customerId: 5, items: [{ productId: 105, quantity: 10 }] },
    { id: 1006, customerId: 1, items: [{ productId: 101, quantity: 1 }, { productId: 105, quantity: 3 }] },
    { id: 1007, customerId: 2, items: [{ productId: 104, quantity: 2 }, { productId: 103, quantity: 1 }] },
    { id: 1008, customerId: 3, items: [{ productId: 102, quantity: 2 }] },
    { id: 1009, customerId: 4, items: [{ productId: 101, quantity: 1 }, { productId: 102, quantity: 1 }] },
    { id: 1010, customerId: 5, items: [{ productId: 103, quantity: 4 }, { productId: 104, quantity: 3 }] },
];
        /*                                                                                                                                                                                    
                                          loc don hang => dung filter                                               
                                      DK: order.customerId === customerId                                           
                                                     │                                                              
                                                     │                                                              
                                                     ▼                                                              
                                         duyet cac items trong don hang                                             
                                              = dung forEach                                                        
                                                     │                                                              
                                                     │                                                              
                                                     ▼                                                              
                                      tim san pham tuong ung de lay gia va ten                                      
                                              => dung find                                                          
                                                     │                                                              
                                                     │                                                              
                                                     │                                                              
                                                     ▼                                                              
                                         tinh tong tien tat ca san pham                                             
                                     itemTotal = product.price * item.quantity                                      
                                                     │                                                              
                                                     │                                                              
                                                     │                                                              
                                                     │                                                              
       += item.quantity                              ▼                                                              
  cong them so luong mua hien tai    ◄──────── kiem tra ket qua  ─────────►   tao doi tuong moi trong danh sach     
        +=itemTotal                            => dung if, else                   name, quantity, totalSpent        
  cong them so tien vua tinh                         │                                                              
                                                     │                                                              
                                                     │                                                              
                                                     ▼                                                              
                                            tinh tong chi tieu khach hang                                           
                                               => dung reduce                                                       
                                                                                                                    
                                                                                                                    
                                                                                                                    
        **/

        const result = customers.map(customer => {
            const customerOders = orders.filter(o => o.customerId === customer.id)

            const productBought = []

            customerOders.forEach(order => {
                order.items.forEach(item => {
                    const product = products.find( p => p.id === item.productId)
                    const exist = productBought.find(p => p.name === product.name)

                    const itemTotal = product.price * item.quantity

                    if (exist) {
                        exist.quantity += item.quantity
                        exist.total += itemTotal
                    }
                    else {
                        productBought.push({
                            name: product.name,
                            quantity: item.quantity,
                            total: itemTotal
                        })
                    }
                })
            })
            const total = productBought.reduce((sum, p) => sum + p.total, 0)

            return {
                id: customer.id,
                name: customer.name,
                total,
                products: productBought
            }
            
        })
        console.log(result)
    </script>
</body>
</html>
