<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="
    https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css
    " rel="stylesheet">
</head>

<style>
    .container {
    width: 600px;
    margin: auto;
    user-select: none;
    }
    table {
        width: 100%;
        margin-top: 20px;
    }
    table thead tr th {
        border-top: 1px solid #ccc;
    }
    td, th {
        padding: 12px;
        border-bottom: 1px solid #ccc;
        font-size: 20px;
    }
    .edit-btn {
        color: green;
    }
    .del-btn {
        color: red;
    }
    .text-align-right {
        text-align: right;
    }
    .text-align-center {
        text-align: center;
    }
    .container input, .container select {
        padding: 12px;
        width: 100%;
        font-size: 15px;
    }
    .search-bar {
        display: flex;
        gap: 10px;
    }
    .search-bar button {
        width: 100px;
        font-size: 16px;
        background: green;
        border: none;
        border-radius: 5px;
        color: white;
    }

    .newemployee {
        padding: 20px;
        width: 300px;
        border: 1px solid black;
        border-radius: 5px;
    }

    #popup {
        display: none;
    }

    #popup form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
    }

    #popup input {
        padding: 10px 14px;
        font-size: 16px;
        border: 1px solid #aaa;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 5px;
    }

    #popup button {
        padding: 10px;
        width: 145px;
        margin-top: 10px;
        cursor: pointer;
    }

    .cancel {
        color: white;
        background-color: red;
        border: none;
    }

    .save {
        color: white;
        background-color: green;
        border: none;
    }
    
</style>

<body>
  <div class="container">
    <div class="search-bar">
      <input placeholder="search employees" name="search"/>
      <button>Add new</button>
    </div>
    <table cellspacing="0">
      <thead>
      <tr>
      </tr>
      </thead>

      <tbody>
      </tbody>
    </table>

    <div id="popup">
        <form>
            <div class="newemployee">
                <h3>Add New Employee</h3>
                <input type="text" id="name" placeholder="Name">
                <input type="text" id="address" placeholder="Address">
                <input type="number" id="age" placeholder="Age">
                <select name="city" id="city">
                  <option value="">--- Select city ---</option>
                  <option value="Ha Noi">Ha Noi</option>
                  <option value="Sai Gon">Sai Gon</option>
                  <option value="Da Nang">Da Nang</option>
                  <option value="Hai phong">Hai Phong</option>
                  <option value="Phan Thiet">Phan Thiet</option>
                </select>
                <div class="button-group">
                    <button type="button" class="cancel" onclick="closePopup()">Canccel</button>
                    <button type="button" class="save" onclick="saveEmployee()">Save</button>
                </div>  
            </div>
        </form>
    </div>
  </div>
  <script>
  const headers = [
    { name: 'id', text: 'Id', align: 'center' },
    { name: 'name', text: 'Ten' },
    { name: 'address', text: 'Dia Chi' },
    { name: 'age', text: 'Tuoi', align: 'right' },
    { name: 'city', text: 'Thanh pho', align: 'center' },
    { name: 'action', text: 'Action', align: 'center' },
  ]

  const employees = [
    {id: 1, name: 'Tran Pham Tin', address: 'Hoai Duc - Ha Noi', age: 27},
    {id: 2, name: 'Nguyen Nam Tao', address: 'Co Nhue - Ha Noi', age: 27},
    {id: 3, name: 'Pham Nguyen Bac', address: 'Soc Son - Ha Noi', age: 27},
  ]

  let editingId = null

  const renderTable = (list) => {
    const tableHeaderE = document.querySelector('table thead tr')
    tableHeaderE.innerHTML = ''
    headers.forEach(header => {
      const cell = document.createElement('th')
      cell.innerText = header.text
      tableHeaderE.append(cell)
    })

    const tableBodyE = document.querySelector('table tbody')
    tableBodyE.innerHTML = ''

    list.forEach(employee => {
      const row = document.createElement('tr')
      headers.forEach(header => {
        const cell = document.createElement('td')
        if (header.name === 'action') {
          const editBtn = document.createElement('span')
          const delBtn = document.createElement('span')

          editBtn.setAttribute('class', 'mdi mdi-pencil-outline edit-btn')
          editBtn.style.cursor = 'pointer'
          editBtn.addEventListener('click', () => openEditPopup(employee))

          delBtn.setAttribute('class', 'mdi mdi-trash-can-outline del-btn')
          delBtn.style.cursor = 'pointer'
          delBtn.addEventListener('click', () => deleteEmployee(employee.id))

          cell.appendChild(editBtn)
          cell.appendChild(delBtn)
        } else {
          cell.innerText = employee[header.name]
        }
        if (header.align) cell.classList.add(`text-align-${header.align}`)
        row.append(cell)
      })
      tableBodyE.append(row)
    })
  }

  const popup = document.getElementById('popup')
  document.querySelector('.search-bar button').addEventListener('click', () => openAddPopup())

  function openAddPopup() {
    editingId = null
    document.getElementById('name').value = ''
    document.getElementById('address').value = ''
    document.getElementById('age').value = ''
    document.getElementById('city').value = ''
    popup.style.display = 'flex'
  }

  function openEditPopup(employee) {
    editingId = employee.id
    document.getElementById('name').value = employee.name
    document.getElementById('address').value = employee.address
    document.getElementById('age').value = employee.age
    document.getElementById('city').value = employee.city
    popup.style.display = 'flex'
  }

  function closePopup() {
    popup.style.display = 'none'
  }

  function clearForm() {
    document.getElementById('name').value = ''
    document.getElementById('address').value = ''
    document.getElementById('age').value = ''
  }

  function saveEmployee() {
    const name = document.getElementById('name').value.trim()
    const address = document.getElementById('address').value.trim()
    const age = document.getElementById('age').value.trim()
    const city = document.getElementById('city').value.trim()

    if (!name || !address || !age || !city) {
      alert('Điền đầy đủ, đừng để lói nhiều!')
      return
    }

    if (editingId !== null) {
      const employee = employees.find(emp => emp.id === editingId)
      if (employee) {
        employee.name = name
        employee.address = address
        employee.age = parseInt(age)
        employee.city = city

        employee.searchStr = `${name}|${address}|${city}|${employee.age}`.toLowerCase()
      }
    } else {
      const newId = employees.length ? employees[employees.length - 1].id + 1 : 1
      employees.push({ id: newId, name, address, age: parseInt(age), city})
    }

    employee.searchStr = `${name}|${address}|${city}|${employee.age}`.toLowerCase()
    employees.push(employee)

    renderTable(employees)
    closePopup()
    clearForm()
  }

  function deleteEmployee(id) {
    const confirmed = confirm('Nghĩ kỹ chưa???')
    if (confirmed) {
      const index = employees.findIndex(emp => emp.id === id)
      if (index !== -1) {
        employees.splice(index, 1)
        renderTable(employees)
      }
    }
  }

  const inputE = document.querySelector('.container input[name="search"]')
  inputE.addEventListener('input', (e) => {
    const filtered = employees.filter(emp =>
      emp.name.toLowerCase().includes(e.target.value.toLowerCase())
    )
    renderTable(filtered)
  })

  renderTable(employees)

  </script>
</body>
</html>
