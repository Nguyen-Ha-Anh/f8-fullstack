        //Bai 2: Doi mau nen xen ke
        const button = document.querySelector('#bgBtn')

        button.addEventListener('click', function() {
            const allP = document.querySelectorAll('p')

            allP.forEach((p, index) => {
                if (index % 2 === 0) {
                    p.style.color = 'lightgray'
                }
                else {
                    p.style.color = 'white'
                }
            })
        })
    </script>
