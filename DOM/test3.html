<body>

    <p id="color-text">Đoạn văn này sẽ đổi màu</p>

    <script>

        // })

        //Bai2: doi mau sac khi re chuot
        const p = document.querySelector('#color-text')
        p.addEventListener('mouseenter', function () {
            p.style.color = 'red'
        })
        p.addEventListener('mouseleave', function() {
            p.style.color = 'black'
        })
    </script>
