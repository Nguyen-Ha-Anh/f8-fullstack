<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="game">
        <div class="questions"></div>
        <div class="options">
            <div class="answer"></div>
            <div class="answer"></div>
            <div class="answer"></div>
            <div class="answer"></div>
        </div>
        <div class="result">Ket qua</div>
    </div>

    <script>
        const questionData = {
            question: 'How is the weather?',
            options: {
                a: 'its good',
                b: 'you r so handsome',
                c: 'its okay',
                d: 'its wonderful country'
            },
            correct: 'a'
        }

        const questionE = document.querySelector('.questions')
        questionE.innerText = questionData.question

        const answerE = document.querySelectorAll('.answer')
        const keys = ['a', 'b', 'c', 'd']

        answerE.forEach((el, index) => {
            const key = keys[index]
            el.innerText = `${key.toUpperCase()} : ${questionData.options[key]}`
        })
    </script>
</body>
</html>
