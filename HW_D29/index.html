<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        padding: 20px;
        box-sizing: border-box;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }

    h3 {
        text-align: center;
        margin-bottom: 30px;
    }

    .product-item {
        border: 1px solid #ccc;
        border-radius: 10px;
        padding: 15px;
    }

    .product-item img {
        width: 100%;
        max-height: 200px;
        margin-bottom: 10px;
        object-fit: contain;
    }

    .product-title {
        font-size: 16px;
        margin: 10px 0;
        font-weight: 600;
        text-align: left;
    }

    .product-price {
        color:  green;
        font-weight: 600;
        margin: 5px 0;
    }

    .description {
        font-size: 14px;
        color: #333;
    }

    .category {
        font-size: 13px;
        color: #666;
        margin-top: 5px;
    }

    .rating {
        font-size: 14px;
        color: orange;
        margin-top: 5px;
    }


</style>
<body>
    <h3>Product List</h3>
    <div class="container"></div>
    <script src="./main.js"></script>
    </div>
</body>
</html>
