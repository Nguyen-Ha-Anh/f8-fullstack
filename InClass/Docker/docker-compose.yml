services:
  web:
    build:
      context: .
      # dockerfile: Dockerfile
    working_dir: /app/web
    volumes:
      - .:/app/web
    ports:
      - "5100:3000"
    command:
      - npm
      - run
      - dev

  # next:
  #   container_name: docker-k14-next
  #   image: node:24-alpine3.21
  #   working_dir: /app/web
  #   volumes:
  #     - .:/app/web
  #   ports:
  #     - "5101:3000"
  #   command: ['npm', 'run', 'dev']

  db:
    container_name: docker-k14-db
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    ports:
      - "5001:5432"
    volumes:
      - ./db/:/var/lib/postgresql/data

  api:
    image: node:24-alpine3.21
    command:
      - npx
      - json-server
      - db.json
